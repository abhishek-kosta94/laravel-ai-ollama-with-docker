services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel13_app
    volumes:
      - ./:/var/www
    env_file:
      - .env.docker
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped      
    networks:
      - app_network   

  nginx:
    image: nginx:1.28-alpine
    container_name: nginx_server
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped     
    networks:
      - app_network 

  node:
    image: node:22-alpine
    container_name: laravel_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - node_modules_data:/var/www/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    restart: unless-stopped
    networks:                                              
      - app_network 

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_ollama
      MYSQL_USER: user
      MYSQL_PASSWORD: user123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10      
    restart: unless-stopped  
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: redis_server
    ports:
      - "6379:6379" #optional (for local tools)
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile  
    container_name: laravel_queue
    entrypoint: []
    command: >
      sh -c "
      echo 'waiting for DB & migrations...' &&
      until php artisan migrate:status > /dev/null 2>&1; do sleep 2; done &&
      php artisan queue:work --tries=3 --timeout=90
      "
    volumes:
      - ./:/var/www
    depends_on:
      - app
      - redis
    restart: unless-stopped   

  scheduler:
    build: 
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_scheduler
    entrypoint: []
    command: >
      sh -c "
      echo 'waiting for DB & migrations...' &&
      until php artisan migrate:status > /dev/null 2>&1; do sleep 2; done &&
      php artisan schedule:work
      "
    volumes:
      - ./:/var/www
    depends_on:
      - app
    restart: unless-stopped         

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025" #web ui
      - "1025:1025" #smtp
    restart: unless-stopped

  phpmyadmin: 
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
          condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network                                                                             

volumes:
  mysql_data:       
  node_modules_data:

networks:
  app_network:
    driver: bridge   